plugins {
    id 'fabric-loom' version '1.14-SNAPSHOT'
}

version = '0.1.0'
group = 'dev.restockmanager'
base { archivesName = 'restock-manager' }

dependencies {
    minecraft "com.mojang:minecraft:1.21.11"
    mappings "net.fabricmc:yarn:1.21.11+build.4:v2"
    modImplementation "net.fabricmc:fabric-loader:0.18.4"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.141.3+1.21.11"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") { expand "version": project.version }
}

tasks.withType(JavaCompile).configureEach { options.release = 21 }
java { withSourcesJar() }

tasks.register('coreTests', JavaExec) {
    dependsOn classes
    classpath = sourceSets.main.output + sourceSets.test.output
    mainClass = 'dev.restockmanager.core.CoreTests'
   tasks.named('test') { enabled = false }
tasks.named('test') { failOnNoDiscoveredTests = false }
}